services:
  phasing:
    build: .
    image: family-phasing:latest
    environment:
      # Host-side published port is configurable through the environment.
      HOST_PORT: ${HOST_PORT:-8080}
    ports:
      - "${HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=2); sys.exit(0 if r.status==200 and json.load(r)['status']=='ok' else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
